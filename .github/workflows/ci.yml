name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + contract tests (stdlib only, no network, no token)
        run: python3 -I -m unittest discover -s agentflow/tests
      - name: YAML subset parity with PyYAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m unittest agentflow/tests/test_afconfig.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin and marketplace manifests
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate ./agentflow
          npx --yes @anthropic-ai/claude-code plugin validate .
